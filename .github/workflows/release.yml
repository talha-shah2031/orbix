name: Orbix Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure tagged commit is on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tags must point to a commit on main." }
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Build Windows executable
        run: go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_REF_NAME -X main.commit=$env:GITHUB_SHA" -o orbix.exe ./cmd/orbix
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
      - name: Publish GitHub release
        run: gh release create "$env:GITHUB_REF_NAME" orbix.exe --title "ORBIX $env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
