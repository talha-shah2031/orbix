name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Build Windows executable
        run: go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_REF_NAME -X main.commit=$env:GITHUB_SHA" -o bnx.exe ./cmd/bnx
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
      - name: Publish GitHub release
        run: gh release create "$env:GITHUB_REF_NAME" bnx.exe --title "BNX $env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
